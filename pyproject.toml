[project]
name = "ps-66"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "cartopy>=0.25.0",
    "copernicusmarine>=2.4.1",
    "dask>=2026.8.0",
    "distributed>=2026.8.0",
    "fastapi>=0.141.1",
    "geoviews>=1.15.1",
    "gsw>=3.6.23",
    "holoviews>=1.23.2",
    "hvplot>=0.12.2",
    "jupyter-bokeh>=4.1.0",
    "matplotlib>=3.11.1",
    "netcdf4>=1.7.4",
    "numpy>=2.5.2",
    "panel>=1.9.4",
    "psutil>=7.2.2",
    "scipy>=1.18.1",
    "torch>=2.14.0",
    "torchaudio>=2.11.0",
    "torchvision>=0.29.0",
    "uvicorn>=0.53.0",
    "xarray>=2026.7.0",
    "xesmf>=0.9.2",
    "zarr>=3.3.0",
]

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
torchaudio = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
